# RaceControl - local development services.
# Works with Docker Desktop (Windows/macOS/Linux) and with podman on Linux.
# The Makefile also offers plain `podman run` targets, so compose is optional.
services:
  db:
    image: docker.io/library/postgres:18-alpine
    container_name: racecontrol-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: racecontrol
      POSTGRES_PASSWORD: racecontrol
      POSTGRES_DB: racecontrol
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U racecontrol -d racecontrol"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
    # Same volume name as `make db-up`, so both ways of starting Postgres share the data.
    name: racecontrol-db-data