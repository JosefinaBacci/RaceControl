version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "sql"
    gen:
      go:
        package: "dbgen"
        out: "internal/db/dbgen"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_empty_slices: true
        emit_exact_table_names: false
        overrides:
          # Points are small decimals the app edits and shows; float64 keeps the
          # query surface plain instead of dragging pgtype.Numeric everywhere.
          - db_type: "pg_catalog.numeric"
            go_type: "float64"
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type:
              type: "float64"
              pointer: true